name: Deploy WarOfAsia Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 授權 GitHub Actions 部署至 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 限制同一時間僅允許一個部署任務
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 部署作業
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上傳整個專案目錄以確保 Markdown 檔案與 dashboard 均可線上存取
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        